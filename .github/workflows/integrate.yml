name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    runs-on: macos-latest
    name: Test
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: npm test # runs on both Bare and Node
  build:
    runs-on: macos-latest
    name: Build app
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/setup-swift@v1
      - run: swift format lint --strict --recursive app
      - run: brew install xcodegen
      - name: Fetch BareKit prebuild
        run: |
          gh release download v2.1.3 --repo holepunchto/bare-kit --pattern prebuilds.zip
          unzip prebuilds.zip 'darwin/*'
          mkdir -p app/frameworks
          mv darwin/BareKit.xcframework app/frameworks/
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run gen # generates the Swift packages xcodegen resolves
      - run: xcodegen generate
      # The build is driven by xcodebuild: scheme pre-actions run bare-link +
      # bare-pack, then it compiles.
      - run: xcodebuild -scheme BareSwitch -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
