name: BareSwitch

options:
  bundleIdPrefix: to.holepunch.bare
  deploymentTarget:
    macOS: '13.0'

# Generated by `npm run addons` — lists the native-addon xcframeworks that
# bare-link resolved, so Xcode embeds them. Must exist before `xcodegen generate`
# (the Makefile runs `make link` first).
include:
  - app/addons/addons.yml

packages:
  # The Bare runtime + worklet/IPC bridge.
  BareKit:
    url: https://github.com/holepunchto/bare-kit-swift
    branch: main
  # The RPC runtime the generated HRPC rides on.
  BareRPC:
    url: https://github.com/holepunchto/bare-rpc-swift
    branch: main
  # Generated from schema/generate.js (`npm run gen`).
  Schema:
    path: swift/schema
  HRPC:
    path: swift/hrpc

targets:
  BareSwitch:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.holepunch.bare.macos
        PRODUCT_NAME: BareSwitch
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5'
        CODE_SIGN_ENTITLEMENTS: app/BareSwitch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Bare Switch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    sources:
      - path: app
        excludes:
          - frameworks
          - addons
          - '*.entitlements'
          - app.bundle
      - path: app/app.bundle
        optional: true
        buildPhase: resources
    dependencies:
      - framework: app/frameworks/BareKit.xcframework
      - package: BareKit
      - package: HRPC
      - package: Schema
      - package: BareRPC
